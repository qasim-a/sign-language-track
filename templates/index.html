<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Language Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        /* --- State Indicator (video overlay) --- */
        .state-indicator {
            position: absolute;
            top: 16px;
            left: 16px;
            font-family: 'DM Mono', monospace;
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 5px 12px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            transition: background 0.2s, color 0.2s;
        }
        .state-ready      { background: rgba(34, 197, 94, 0.18);  color: #22c55e; }
        .state-signing    { background: rgba(249, 115, 22, 0.18); color: #f97316; }
        .state-predicting { background: rgba(139, 92, 246, 0.18); color: #8b5cf6; }

        /* --- Test Mode Overlay --- */
        #test-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.82);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
        }
        #test-overlay.active { display: flex; }

        .test-box {
            background: #fff;
            border-radius: 16px;
            padding: 40px 48px;
            min-width: 380px;
            max-width: 480px;
            width: 100%;
            text-align: center;
        }

        .test-progress {
            font-family: 'DM Mono', monospace;
            font-size: 12px;
            color: #aaa;
            letter-spacing: 0.08em;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .test-attempt-count {
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            color: #ccc;
            letter-spacing: 0.06em;
            margin-bottom: 16px;
        }

        .test-sign-prompt {
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 500;
            color: #888;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .test-sign-name {
            font-family: 'DM Sans', sans-serif;
            font-size: 42px;
            font-weight: 600;
            color: #111;
            margin-bottom: 24px;
            line-height: 1.1;
        }

        .test-attempts {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 28px;
        }

        .attempt-dot {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'DM Mono', monospace;
            font-size: 13px;
            color: #bbb;
            transition: all 0.2s;
        }
        .attempt-dot.correct   { background: #e6f7ee; border-color: #2ecc71; color: #2ecc71; font-weight: 600; }
        .attempt-dot.incorrect { background: #fdecea; border-color: #e74c3c; color: #e74c3c; font-weight: 600; }
        .attempt-dot.active    { border-color: #E87722; color: #E87722; }

        .test-live-result {
            font-family: 'DM Mono', monospace;
            font-size: 16px;
            font-weight: 500;
            color: #888;
            min-height: 24px;
            margin-bottom: 8px;
            transition: color 0.15s;
        }
        .test-live-result.correct   { color: #2ecc71; }
        .test-live-result.incorrect { color: #e74c3c; }

        .test-status-msg {
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            color: #aaa;
            min-height: 18px;
        }

        /* --- Results Screen --- */
        #results-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.82);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #results-overlay.active { display: flex; }

        .results-box {
            background: #fff;
            border-radius: 16px;
            padding: 36px 44px;
            min-width: 420px;
            max-width: 540px;
            width: 100%;
        }

        .results-title {
            font-family: 'DM Sans', sans-serif;
            font-size: 20px;
            font-weight: 600;
            color: #111;
            margin-bottom: 6px;
        }

        .results-summary {
            font-family: 'DM Mono', monospace;
            font-size: 12px;
            color: #888;
            margin-bottom: 20px;
        }

        .results-text {
            font-family: 'DM Mono', monospace;
            font-size: 12px;
            line-height: 1.8;
            color: #333;
            background: #f8f8f8;
            border-radius: 8px;
            padding: 16px 18px;
            white-space: pre-wrap;
            max-height: 340px;
            overflow-y: auto;
            margin-bottom: 20px;
            user-select: all;
        }

        .results-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 500;
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.15s;
        }
        .btn-primary            { background: #E87722; color: #fff; }
        .btn-primary:hover      { background: #d06a1a; }
        .btn-secondary          { background: #f0f0f0; color: #555; }
        .btn-secondary:hover    { background: #e4e4e4; }

        #start-test-btn {
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 500;
            padding: 9px 18px;
            border-radius: 8px;
            border: 1.5px solid #E87722;
            background: transparent;
            color: #E87722;
            cursor: pointer;
            transition: all 0.15s;
        }
        #start-test-btn:hover { background: #E87722; color: #fff; }
    </style>
</head>
<body>
    <header>
        <div class="logo">SignLanguage<span>Track</span></div>
        <div style="display:flex;align-items:center;gap:16px;">
            <button id="start-test-btn">Run Test</button>
            <div class="status">
                <span class="status-dot"></span>
                <span>Live</span>
            </div>
        </div>
    </header>

    <main>
        <div class="video-panel">
            <div class="video-wrapper">
                <img src="/video" alt="Webcam Feed">
                <div class="state-indicator state-ready" id="state-indicator">Ready</div>
            </div>
        </div>

        <div class="info-panel">
            <div class="card sign-card">
                <div class="card-label">Detected Sign</div>
                <div class="sign-display" id="sign">—</div>
                <div class="confidence-row">
                    <span class="confidence-label">Confidence</span>
                    <span class="confidence-value" id="confidence-text"></span>
                </div>
                <div class="confidence-bar-bg">
                    <div class="confidence-bar" id="confidence-bar"></div>
                </div>
            </div>

            <div class="card history-card">
                <div class="card-label">Recent Signs</div>
                <div class="history-list" id="history"></div>
            </div>

            <div class="card supported-card">
                <div class="card-label">Supported Signs</div>
                <div class="supported-list">
                    <span class="tag">Hello</span>
                    <span class="tag">Yes</span>
                    <span class="tag">No</span>
                    <span class="tag">Thank you</span>
                    <span class="tag">Please</span>
                    <span class="tag">Eat</span>
                    <span class="tag">Drink</span>
                    <span class="tag">Water</span>
                    <span class="tag">More</span>
                    <span class="tag">Apple</span>
                    <span class="tag">Mother</span>
                </div>
            </div>
        </div>
    </main>

    <!-- Test Mode Overlay -->
    <div id="test-overlay">
        <div class="test-box">
            <div class="test-progress" id="test-progress">Sign 1 of 11</div>
            <div class="test-attempt-count" id="test-attempt-count">Attempt 1 of 3</div>
            <div class="test-sign-prompt">Sign this word</div>
            <div class="test-sign-name" id="test-sign-name">Hello</div>
            <div class="test-attempts" id="test-attempts">
                <div class="attempt-dot active" id="dot-0">1</div>
                <div class="attempt-dot" id="dot-1">2</div>
                <div class="attempt-dot" id="dot-2">3</div>
            </div>
            <div class="test-live-result" id="test-live-result"></div>
            <div class="test-status-msg" id="test-status-msg">Sign once, then drop your hand</div>
        </div>
        <button class="btn btn-secondary" id="cancel-test-btn">Cancel Test</button>
    </div>

    <!-- Results Overlay -->
    <div id="results-overlay">
        <div class="results-box">
            <div class="results-title">Test Results</div>
            <div class="results-summary" id="results-summary"></div>
            <div class="results-text" id="results-text"></div>
            <div class="results-actions">
                <button class="btn btn-primary" id="copy-results-btn">Copy Results</button>
                <button class="btn btn-secondary" id="close-results-btn">Close</button>
            </div>
        </div>
    </div>

    <script src="/static/js/main.js"></script>
</body>
</html>
